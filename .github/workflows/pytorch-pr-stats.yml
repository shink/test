name: Weekly PyTorch PR Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
  pull_request:

jobs:
  collect-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests PyGithub pyyaml

      - name: Generate PR stats
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            python pytorch/pr-stats.py --path pytorch/pytorch.yml --dry-run
          else
            python pytorch/pr-stats.py --path pytorch/pytorch.yml
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
